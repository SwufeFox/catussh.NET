name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: dotnet build Catussh.slnx -c Release --nologo

      - name: Test (.NET)
        run: dotnet test tests/Catussh.Core.Tests/Catussh.Core.Tests.csproj -c Release --no-build --nologo

      - name: Check design tokens
        run: node tests/Catussh.Design.Tests/design.spec.mjs

      - name: Check file encodings
        run: node tools/check-encoding.mjs src

      - name: Verify publish works
        run: dotnet publish src/Catussh.App -p:PublishProfile=win-x64 --nologo
