<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>catussh</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="monitor.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font: var(--font-body);
      color: var(--rx-ink);
      background: var(--rx-window);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    ::selection { background: var(--rx-accent-fill); }
    .rx-content::-webkit-scrollbar { width: 10px; }
    .rx-content::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--rx-ink) 18%, transparent);
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- api.js first: the pages and the monitor both read the Api global. -->
  <script src="api.js"></script>
  <script src="monitor.js"></script>
  <script src="app.js"></script>
</body>
</html>
